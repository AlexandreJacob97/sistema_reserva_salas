<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse sua conta reserve.me para reservar salas."
    />
    <title>Entrar | reserve.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="login-page">
      <section class="login-panel" aria-labelledby="brand">
        <a class="brand" id="brand" href="#" aria-label="reserve.me">
          reserve<span>.me</span>
        </a>

        <form class="login-form" novalidate>
          <div class="field">
            <label class="visually-hidden" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              aria-describedby="required-note email-error"
              required
            />
            <p class="field-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="visually-hidden" for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Senha"
              autocomplete="current-password"
              aria-describedby="required-note password-error"
              required
            />
            <p class="field-error" id="password-error" aria-live="polite"></p>
          </div>

          <p class="required-note" id="required-note">
            <span aria-hidden="true">*</span> Campos obrigatórios
          </p>

          <button class="login-button" type="submit">Entrar</button>

          <a class="forgot-password" href="recuperar-senha.html">
            Esqueceu sua senha?
          </a>
        </form>
      </section>

      <footer class="page-footer">
        <a href="reservas.html">Salas e reservas</a>
        <span aria-hidden="true">·</span>
        <a href="termos-e-privacidade.html#termos-de-uso">Termos de uso</a>
        <span aria-hidden="true">·</span>
        <a href="termos-e-privacidade.html#privacidade">Privacidade</a>
      </footer>
    </main>
  </body>
</html>
